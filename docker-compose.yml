services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezbase
      POSTGRES_PASSWORD: ezbase
      POSTGRES_DB: ezbase
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezbase"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://ezbase:ezbase@postgres:5432/ezbase
      PORT: "8080"
      # ADMIN_KEY: "your-secret-admin-key"    # auto-generated if not set
      BETTER_AUTH_SECRET: "dev-auth-secret-change-in-prod"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build: ./console
    volumes:
      - ./console:/app
      - console_node_modules:/app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "7003:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - console

volumes:
  pgdata:
  console_node_modules:
