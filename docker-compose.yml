services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezbase
      POSTGRES_PASSWORD: ezbase
      POSTGRES_DB: ezbase
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezbase"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://ezbase:ezbase@postgres:5432/ezbase
      PORT: "8080"
      ADMIN_KEY: "test-admin-key"
      RULES_PATH: "/tmp/rules.json"
      STORAGE_PATH: "/tmp/ezbase-files"
      EZBASE_URL: "http://localhost:7003"    # public URL — trusted auth origin + OAuth callback URLs
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
      # GITHUB_CLIENT_ID: ""
      # GITHUB_CLIENT_SECRET: ""
      # MICROSOFT_CLIENT_ID: ""
      # MICROSOFT_CLIENT_SECRET: ""
      # APPLE_CLIENT_ID: ""
      # APPLE_CLIENT_SECRET: ""
    volumes:
      - storage:/tmp/ezbase-files
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build: ./console
    volumes:
      - ./console:/app
      - console_node_modules:/app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "7003:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - console

volumes:
  pgdata:
  console_node_modules:
  storage:
