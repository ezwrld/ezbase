name: Publish SDK to npm

on:
  push:
    branches: [master]
    paths:
      - 'sdk/**'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Determine version
        id: version
        working-directory: sdk
        run: |
          # sdk/package.json is authoritative: if its version isn't on npm yet
          # (e.g. a deliberate bump like 1.0.0), publish it as-is. Otherwise
          # auto-bump minor (npm requires x.y.z; patch stays 0 → 1.1.0, 1.2.0, ...)
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "@ezwrld/ezbase@$CURRENT" version > /dev/null 2>&1; then
            npm version minor --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and publish
        working-directory: sdk
        run: |
          npm install
          npm run build
          npm publish --access public

      - name: Tag and push version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet sdk/package.json; then
            git add sdk/package.json
            git commit -m "sdk: release v${{ steps.version.outputs.VERSION }}"
            git push
          fi
          git tag "sdk-v${{ steps.version.outputs.VERSION }}"
          git push --tags
