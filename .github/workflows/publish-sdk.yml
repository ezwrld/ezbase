name: Publish SDK to npm

on:
  push:
    branches: [master]
    paths:
      - 'sdk/**'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Determine version
        id: version
        working-directory: sdk
        run: |
          # sdk/package.json wins when its version isn't on npm yet (a deliberate
          # bump like 2.0.0). Otherwise bump minor from npm's latest — master is
          # protected, so the bump is never committed back.
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "@ezwrld/ezbase@$CURRENT" version > /dev/null 2>&1; then
            npm version "$(npm view @ezwrld/ezbase version)" --no-git-tag-version --allow-same-version
            npm version minor --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and publish
        working-directory: sdk
        run: |
          npm install
          npm run build
          npm publish --access public

      - name: Tag version
        run: |
          git tag "sdk-v${{ steps.version.outputs.VERSION }}"
          git push origin "sdk-v${{ steps.version.outputs.VERSION }}"
