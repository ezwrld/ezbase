name: Publish Docker image

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'console/**'
      - 'nginx/**'
      - 'docker/**'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release (e.g. 1.10). Empty = increment the right-hand number from the latest tag.'
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          # Manual dispatch with an explicit version wins. Otherwise find the latest
          # v* tag and increment its right-hand number (1.9 → 1.10). Old three-part
          # tags are read fine; their third component is ignored.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEXT="${{ github.event.inputs.version }}"
          else
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
            if [ -z "$LATEST" ]; then
              LATEST="0.0"
            fi
            MAJOR=$(echo $LATEST | cut -d. -f1)
            MINOR=$(echo $LATEST | cut -d. -f2)
            NEXT="$MAJOR.$((MINOR + 1))"
          fi
          echo "VERSION=$NEXT" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EZBASE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push --tags

      - name: Create GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Extract this version's section from CHANGELOG.md
          NOTES=$(awk "/^## v${VERSION}([^0-9]|$)/{flag=1;next} /^## v/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}. No CHANGELOG entry was written for this release — see commit history."
          fi
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "$NOTES" || \
            echo "release already exists, skipping"
