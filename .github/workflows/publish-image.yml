name: Publish Docker image

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'console/**'
      - 'nginx/**'
      - 'docker/**'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release (e.g. 1.0). Empty = auto-bump minor from latest tag.'
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          # Manual dispatch with an explicit version wins (e.g. "1.0" for a major
          # launch). Otherwise major.minor auto-bump: find the latest v* tag (old
          # three-part tags are read fine — the patch digit is ignored), bump minor.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEXT="${{ github.event.inputs.version }}"
          else
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
            if [ -z "$LATEST" ]; then
              LATEST="0.0"
            fi
            MAJOR=$(echo $LATEST | cut -d. -f1)
            MINOR=$(echo $LATEST | cut -d. -f2)
            NEXT="$MAJOR.$((MINOR + 1))"
          fi
          echo "VERSION=$NEXT" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push --tags
