name: Validate

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install, bundle, and test server
        working-directory: server
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun build src/index.ts --target=bun --outdir=/tmp/ezbase-server-build
          bun test

      - name: Install and build console
        working-directory: console
        run: |
          bun install
          bun run build

      - name: Install, build, and test SDK
        working-directory: sdk
        run: |
          npm install
          npm test

      - name: Build production image
        run: docker build --build-arg EZBASE_VERSION=ci --tag ezbase:ci .
